name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy  # pygame without a screen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Unit tests
        run: uv run pytest -q
      - name: Every figure can be redrawn from the cache, without training
        run: uv run python -m experiments.run_all
      - name: The Optuna search runs
        run: uv run python -m experiments.tune --quick --workers 2 --storage /tmp/smoke.db --envs cliff_walking --algos SARSA
